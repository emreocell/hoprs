[package]
name = "hoprs-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "SSH terminal, SFTP and FTP/FTPS client"

[dependencies]
hoprs-core = { path = "../hoprs-core" }
hoprs-vault = { path = "../hoprs-vault" }
hoprs-ssh = { path = "../hoprs-ssh" }
hoprs-remote = { path = "../hoprs-remote" }
hoprs-transfer = { path = "../hoprs-transfer" }
hoprs-import = { path = "../hoprs-import" }
iced = { workspace = true }
# iced's own crates (already in its tree, same versions), for `bench`: a user interface
# laid out and drawn without a window.
iced_runtime = "0.14"
iced_tiny_skia = "0.14"
tokio = { workspace = true, features = ["rt", "sync", "macros", "time", "io-util"] }
tokio-util = { workspace = true }
futures-util = { workspace = true }
async-trait = { workspace = true }
secrecy = { workspace = true }
dirs = { workspace = true }
fs4 = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
# Terminal emulation core (grid, parser, selection, search).
alacritty_terminal = { version = "0.26", default-features = false }
# Native file dialogs. Linux: the XDG desktop portal over libdbus (loaded at run time),
# falling back to zenity; no GTK, no extra D-Bus stack.
rfd = { version = "0.18", default-features = false, features = ["xdg-portal"] }
# Remote editing: watches the local copies (inotify on Linux).
notify = "8.2"
# Splits the editor command with shell quoting rules, without running a shell. Already in
# the dependency tree (no new download), dependency-free, MIT OR Apache-2.0.
shlex = "2.0"
# Decodes the embedded window icon. iced's own `image` feature would pull in the whole
# `image` crate with every codec; `png` is the one format needed. MIT OR Apache-2.0.
png = "0.18"

# Windows: attach to the parent console so `hoprs.exe --version` prints (GUI subsystem).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
] }

[[bin]]
name = "hoprs"
path = "src/main.rs"

[lib]
bench = false

[[bench]]
name = "ui"
harness = false

[[bench]]
name = "startup"
harness = false

[dev-dependencies]
criterion = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "sync", "macros", "time", "test-util"] }
hoprs-remote = { path = "../hoprs-remote", features = ["testing"] }
hoprs-ssh = { path = "../hoprs-ssh", features = ["testing"] }

# Debian package, built by scripts/package-deb.sh and checked by scripts/check-deb.sh.
[package.metadata.deb]
name = "hoprs"
# A fixed project identity: no personal name or e-mail ships in the package. `.invalid`
# is reserved (RFC 2606), so the address can never reach anyone.
maintainer = "hoprs developers <noreply@hoprs.invalid>"
copyright = "hoprs developers"
license-file = ["../../LICENSE-MIT", "0"]
section = "net"
priority = "optional"
extended-description = """\
hoprs is a fast, native desktop client for SSH, SFTP, FTP and FTPS. Save your sites, \
group them into workspaces, browse local and remote files side by side, and queue \
transfers that resume and handle conflicts. SSH sites open a terminal, a file browser, \
or both over one connection. Credentials live in the system keyring, and sites can be \
imported from FileZilla."""
# `$auto` covers what the binary links (libc6 only). The rest is loaded at run time
# (dlopen), which `$auto` cannot see; the list is every `lib*.so.N` name in the binary,
# confirmed by scripts/check-deb.sh (the start-up probe under Xvfb on a clean Ubuntu 24.04
# fails without the X11 ones, and every library it loads must come from here):
# - ca-certificates: the system roots FTPS trusts (rustls-native-certs reads them);
# - libx11-6, libx11-xcb1, libxcb1, libxcursor1, libxi6: winit's X11 backend;
# - libxkbcommon0, libxkbcommon-x11-0: winit's keyboard handling (X11 and Wayland);
# - libwayland-client0: winit's Wayland backend; libwayland-egl1: wgpu's GL on Wayland;
# - libvulkan1, libegl1: wgpu's Vulkan and GL loaders. libegl1 brings in Mesa, whose
#   software adapter (llvmpipe) iced would use on a machine without a GPU; hoprs picks
#   tiny-skia itself there (src/renderer.rs);
# - libdbus-1-3: rfd's file dialogs through the XDG desktop portal.
depends = """$auto, ca-certificates, libx11-6, libx11-xcb1, libxcb1, libxcursor1, libxi6, \
libxkbcommon0, libxkbcommon-x11-0, libwayland-client0, libwayland-egl1, libvulkan1, libegl1, \
libdbus-1-3"""
recommends = "xdg-desktop-portal, gnome-keyring | kwalletmanager | keepassxc"
suggests = "openssh-client"
assets = [
    ["target/release/hoprs", "usr/bin/", "755"],
    ["../../packaging/linux/io.github.engviniciusbs.hoprs.desktop", "usr/share/applications/", "644"],
    ["../../packaging/linux/io.github.engviniciusbs.hoprs.metainfo.xml", "usr/share/metainfo/", "644"],
    ["assets/icon/hoprs.svg", "usr/share/icons/hicolor/scalable/apps/io.github.engviniciusbs.hoprs.svg", "644"],
    ["assets/icon/hoprs-16.png", "usr/share/icons/hicolor/16x16/apps/io.github.engviniciusbs.hoprs.png", "644"],
    ["assets/icon/hoprs-24.png", "usr/share/icons/hicolor/24x24/apps/io.github.engviniciusbs.hoprs.png", "644"],
    ["assets/icon/hoprs-32.png", "usr/share/icons/hicolor/32x32/apps/io.github.engviniciusbs.hoprs.png", "644"],
    ["assets/icon/hoprs-48.png", "usr/share/icons/hicolor/48x48/apps/io.github.engviniciusbs.hoprs.png", "644"],
    ["assets/icon/hoprs-64.png", "usr/share/icons/hicolor/64x64/apps/io.github.engviniciusbs.hoprs.png", "644"],
    ["assets/icon/hoprs-128.png", "usr/share/icons/hicolor/128x128/apps/io.github.engviniciusbs.hoprs.png", "644"],
    ["assets/icon/hoprs-256.png", "usr/share/icons/hicolor/256x256/apps/io.github.engviniciusbs.hoprs.png", "644"],
    ["assets/icon/hoprs-512.png", "usr/share/icons/hicolor/512x512/apps/io.github.engviniciusbs.hoprs.png", "644"],
    ["../../LICENSE-MIT", "usr/share/doc/hoprs/", "644"],
    ["../../LICENSE-APACHE", "usr/share/doc/hoprs/", "644"],
]
