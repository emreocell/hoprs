[package]
name = "hoprs-remote"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[features]
testing = ["hoprs-ssh/testing"]

[dependencies]
hoprs-core = { path = "../hoprs-core" }
hoprs-ssh = { path = "../hoprs-ssh" }
russh.workspace = true
russh-sftp.workspace = true
tokio = { workspace = true, features = ["io-util", "fs", "net", "rt", "sync", "time"] }
async-trait.workspace = true
futures-util.workspace = true
secrecy.workspace = true
suppaftp.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["io-util", "fs", "macros", "net", "rt", "time", "test-util"] }
tempfile.workspace = true
hoprs-ssh = { path = "../hoprs-ssh", features = ["testing"] }

[[test]]
name = "ftp"
required-features = ["testing"]
