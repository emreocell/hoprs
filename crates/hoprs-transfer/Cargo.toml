[package]
name = "hoprs-transfer"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
bench = false

[dependencies]
hoprs-core = { path = "../hoprs-core" }
hoprs-remote = { path = "../hoprs-remote" }
rusqlite = { workspace = true }
tokio = { workspace = true, features = ["io-util", "time", "sync", "rt", "macros"] }
tokio-util = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "sync", "time", "io-util", "test-util"] }
tempfile = { workspace = true }
async-trait = { workspace = true }
hoprs-remote = { path = "../hoprs-remote", features = ["testing"] }
hoprs-ssh = { path = "../hoprs-ssh", features = ["testing"] }
sha2 = { workspace = true }
criterion = { workspace = true }

[[bench]]
name = "engine"
harness = false

# Spec §9 network targets against docker/compose.bench.yml; does nothing unless
# HOPRS_BENCH_NETWORK=1 (scripts/perf.sh).
[[bench]]
name = "network"
harness = false
