name: Site

# The landing page under site/. Builds on every change to it; deploy comes later.
on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/site.yml', 'Cargo.toml']
  pull_request:
    paths: ['site/**', '.github/workflows/site.yml', 'Cargo.toml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # Build before test: the prerender test reads dist/.
      - run: npm run build
      - run: npm test
      - uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: site/dist
