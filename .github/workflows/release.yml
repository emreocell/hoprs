# Publishes a GitHub Release when a v* tag is pushed: hoprs_<version>-1_amd64.deb and
# SHA256SUMS, with the tag's CHANGELOG.md section as the notes. Every check runs before
# `gh release create`, so a failure at any step publishes nothing.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# One run per tag; a second push of the same tag waits, and then fails at
# `gh release create` because the release already exists.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    # package-deb.sh builds inside an Ubuntu 24.04 container, so the host does not
    # matter for the binary; it is named anyway.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      # No token in .git/config: package-deb.sh mounts the repository into the build
      # container, where every build script and proc-macro runs, and this job's token can
      # write releases.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Tag matches the workspace version
        run: |
          tag_version=${GITHUB_REF_NAME#v}
          crate_version=$(scripts/workspace-version.sh)
          if [ "$tag_version" != "$crate_version" ]; then
            echo "::error::tag $GITHUB_REF_NAME is version $tag_version, but [workspace.package] version in Cargo.toml is $crate_version"
            exit 1
          fi
          echo "VERSION=$crate_version" >> "$GITHUB_ENV"

      # Before the build: a missing or empty CHANGELOG section fails in seconds.
      - name: Release notes
        run: scripts/release-notes.sh "$VERSION" > notes.md

      - name: Build the .deb
        run: |
          deb=$(scripts/package-deb.sh)
          echo "DEB=$deb" >> "$GITHUB_ENV"

      # HOPRS_BUILDER_HOME: prefixes that must not appear in the binary. The runner's
      # $HOME, and the container build's: its HOME is /tmp (checked as /tmp/.cargo and
      # /tmp/.rustup, since a bare /tmp is legitimately in the binary, e.g.
      # /tmp/.X11-unix), the repository at /src, the image's toolchain in /opt.
      - name: Check the .deb on a clean Ubuntu 24.04
        run: |
          HOPRS_BUILDER_HOME="$HOME:/tmp/.cargo:/tmp/.rustup:/src/crates/:/src/target/:/opt/cargo/:/opt/rustup/" \
            scripts/check-deb.sh "$DEB"

      - name: SHA256SUMS
        run: |
          mkdir dist
          cp "$DEB" dist/
          cd dist
          sha256sum hoprs_*.deb > SHA256SUMS
          sha256sum --check SHA256SUMS
          cat SHA256SUMS

      # All or nothing: a draft first (invisible to users), the assets uploaded and
      # verified against the local files, and only then made public.
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          if [[ "$VERSION" == *-* ]]; then
            prerelease=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag "${prerelease[@]}" \
            --title "hoprs $VERSION" --notes-file notes.md
          echo "DRAFT_CREATED=1" >> "$GITHUB_ENV"

      # Downloaded back and checked against SHA256SUMS: the bytes on the release, not
      # just their sizes. A draft's assets download with the token.
      - name: Upload and verify the assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" dist/hoprs_*.deb dist/SHA256SUMS
          check="$RUNNER_TEMP/release-assets"
          mkdir "$check"
          gh release download "$GITHUB_REF_NAME" --dir "$check"
          ls -l "$check"
          for file in dist/hoprs_*.deb dist/SHA256SUMS; do
            if [ ! -f "$check/$(basename "$file")" ]; then
              echo "::error::asset $(basename "$file") is not on the release"
              exit 1
            fi
          done
          cmp dist/SHA256SUMS "$check/SHA256SUMS"
          (cd "$check" && sha256sum --check --strict SHA256SUMS)

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false

      # A failed or cancelled run leaves no draft behind, so a re-run can create it again.
      # Only a draft this run created is deleted (never a published release, never the tag).
      - name: Delete the draft on failure or cancel
        if: (failure() || cancelled()) && env.DRAFT_CREATED == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)" = "true" ]; then
            gh release delete "$GITHUB_REF_NAME" --yes
          fi
