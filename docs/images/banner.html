<!DOCTYPE html>
<!-- Source of docs/images/banner.png (the README header). Rendered by scripts/readme-banner.sh
     with headless Chrome at 1280x640 CSS px, device scale 2. Uses the app's own fonts, logo
     and the README screenshots; no network. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>hoprs banner</title>
<style>
@font-face { font-family: "Inter"; font-weight: 400; src: url("../../crates/hoprs-app/assets/fonts/Inter-Regular.ttf"); }
@font-face { font-family: "Inter"; font-weight: 500; src: url("../../crates/hoprs-app/assets/fonts/Inter-Medium.ttf"); }
@font-face { font-family: "Inter"; font-weight: 600; src: url("../../crates/hoprs-app/assets/fonts/Inter-SemiBold.ttf"); }
@font-face { font-family: "JetBrains Mono"; font-weight: 400; src: url("../../crates/hoprs-app/assets/fonts/JetBrainsMono-Regular.ttf"); }
:root {
  --paper: #0b0b0b; --paper-2: #141414; --ink: #f5f5f5; --ink-2: #cfcfcf;
  --muted: #8f8f8f; --rule: #2a2a2a; --rule-2: #3d3d3d;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1280px; height: 640px; background: var(--paper); overflow: hidden; }
body { font-family: "Inter", sans-serif; color: var(--ink); position: relative; }

/* faint grid, like ruled paper: 1 px lines, no gradient */
.grid { position: absolute; inset: 0;
  background-image:
    linear-gradient(var(--paper-2) 1px, transparent 1px),
    linear-gradient(90deg, var(--paper-2) 1px, transparent 1px);
  background-size: 40px 40px; }
.frame { position: absolute; inset: 0; border: 1px solid var(--rule); }

.copy { position: absolute; left: 64px; top: 0; bottom: 0; width: 430px;
  display: flex; flex-direction: column; justify-content: center; }
.brand { display: flex; align-items: center; gap: 20px; }
.brand img { width: 84px; height: 84px; }
.brand span { font-size: 84px; font-weight: 600; letter-spacing: -0.035em; line-height: 1; }
.tagline { margin-top: 30px; font-size: 31px; font-weight: 500; line-height: 1.22;
  letter-spacing: -0.015em; }
.sub { margin-top: 16px; font-size: 19px; line-height: 1.45; color: var(--muted); }
.protocols { margin-top: 30px; display: flex; gap: 8px; }
.protocols span { font-family: "JetBrains Mono", monospace; font-size: 15px; color: var(--ink-2);
  border: 1px solid var(--rule-2); border-radius: 4px; padding: 5px 10px; background: var(--paper); }
.platforms { margin-top: 18px; font-size: 16px; color: var(--muted); }

.shot { position: absolute; border: 1px solid var(--rule-2); border-radius: 8px; overflow: hidden;
  background: var(--paper); }
.shot img { display: block; width: 100%; }
.shot.back  { left: 640px; top: 56px;  width: 620px; opacity: 0.7; }
.shot.front { left: 540px; top: 150px; width: 800px; }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="shot back"><img src="terminal.png" alt=""></div>
  <div class="shot front"><img src="drag.png" alt=""></div>
  <div class="copy">
    <div class="brand">
      <img src="../../crates/hoprs-app/assets/icon/hoprs.svg" alt="">
      <span>hoprs</span>
    </div>
    <p class="tagline">SSH, SFTP and FTP<br>in one window.</p>
    <p class="sub">A fast, native desktop client.<br>Written in Rust.</p>
    <div class="protocols"><span>ssh</span><span>sftp</span><span>ftp</span><span>ftps</span></div>
    <p class="platforms">Linux · macOS · Windows</p>
  </div>
  <div class="frame"></div>
</body>
</html>
