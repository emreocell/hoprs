[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
tokio = "1.54"
tokio-util = "0.7"
async-trait = "0.1"
thiserror = "2"
rusqlite = { version = "0.42", features = ["bundled"] }
tempfile = "3"
criterion = "0.7"
