# hoprs integration test server: implicit FTPS behind a simulated NAT. Test-only.
# Passive replies advertise 10.255.255.1, an unreachable address, so clients must fall back
# to the control connection's host (Plan 3, Review Focus 1).
listen=YES
listen_ipv6=NO
listen_port=990
background=NO

anonymous_enable=NO
local_enable=YES
write_enable=YES
local_umask=022
allow_writeable_chroot=YES
mdtm_write=NO
utf8_filesystem=YES
pam_service_name=vsftpd

idle_session_timeout=8

pasv_enable=YES
pasv_min_port=31000
pasv_max_port=31009
pasv_address=10.255.255.1
pasv_promiscuous=NO

ssl_enable=YES
implicit_ssl=YES
force_local_logins_ssl=YES
force_local_data_ssl=YES
allow_anon_ssl=NO
rsa_cert_file=/etc/vsftpd/certs/server.pem
rsa_private_key_file=/etc/vsftpd/certs/server.key
ssl_tlsv1=NO
ssl_sslv2=NO
ssl_sslv3=NO
ssl_ciphers=HIGH
# Data connections do not have to resume the control connection's TLS session.
require_ssl_reuse=NO

# Required inside a container.
seccomp_sandbox=NO
secure_chroot_dir=/var/run/vsftpd/empty
