# hoprs benchmark server (docker/compose.bench.yml): plain FTP behind netem. Test-only.
# Bridge network (netem cannot go on the host's interfaces) with published ports; passive
# replies announce 127.0.0.1, where the passive ports are published, so every client
# (hoprs, lftp) connects there without a NAT workaround.
listen=YES
listen_ipv6=NO
listen_port=21
background=NO

anonymous_enable=NO
local_enable=YES
write_enable=YES
local_umask=022
allow_writeable_chroot=YES
mdtm_write=NO
utf8_filesystem=YES
pam_service_name=vsftpd

idle_session_timeout=300
data_connection_timeout=300

pasv_enable=YES
pasv_min_port=33000
pasv_max_port=33019
pasv_address=127.0.0.1
pasv_promiscuous=NO
port_enable=NO

ssl_enable=NO

# Required inside a container.
seccomp_sandbox=NO
secure_chroot_dir=/var/run/vsftpd/empty
