# hoprs integration test server: plain FTP with short idle timeouts (Plan 6, Task 5). Test-only.
# Bridge network with published ports, so `docker pause` simulates a silent drop: the
# kernel still accepts connections, nothing ever answers. Passive replies announce the
# container's address; clients reach it through the control host (NAT workaround).
listen=YES
listen_ipv6=NO
listen_port=21
background=NO

anonymous_enable=NO
local_enable=YES
write_enable=YES
local_umask=022
allow_writeable_chroot=YES
mdtm_write=NO
utf8_filesystem=YES
pam_service_name=vsftpd

# A session with no command for 20 s is closed with "421 Timeout.".
idle_session_timeout=20
# A stalled data transfer is closed after 10 s.
data_connection_timeout=10

pasv_enable=YES
pasv_min_port=32000
pasv_max_port=32009
pasv_promiscuous=NO
port_enable=NO

ssl_enable=NO

# Required inside a container.
seccomp_sandbox=NO
secure_chroot_dir=/var/run/vsftpd/empty
