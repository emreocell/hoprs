# hoprs integration test server: plain FTP with optional explicit FTPS (AUTH TLS). Test-only.
# Runs with network_mode: host so active mode works; binds loopback only.
listen=YES
listen_ipv6=NO
listen_address=127.0.0.1
listen_port=2121
background=NO

anonymous_enable=NO
local_enable=YES
write_enable=YES
local_umask=022
allow_writeable_chroot=YES
mdtm_write=NO
utf8_filesystem=YES
pam_service_name=vsftpd

idle_session_timeout=8

pasv_enable=YES
pasv_min_port=30000
pasv_max_port=30019
pasv_promiscuous=NO
port_enable=YES

# Explicit FTPS is optional on this server.
ssl_enable=YES
force_local_logins_ssl=NO
force_local_data_ssl=NO
allow_anon_ssl=NO
rsa_cert_file=/etc/vsftpd/certs/server.pem
rsa_private_key_file=/etc/vsftpd/certs/server.key
ssl_tlsv1=NO
ssl_sslv2=NO
ssl_sslv3=NO
ssl_ciphers=HIGH
# Data connections do not have to resume the control connection's TLS session.
require_ssl_reuse=NO

# Required inside a container.
seccomp_sandbox=NO
secure_chroot_dir=/var/run/vsftpd/empty
